server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # TLS ends at Cloudflare, so keep redirects relative.
  absolute_redirect off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

  location /_astro/ {
    # File names carry a content hash.
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
