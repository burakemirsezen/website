server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # TLS ends at Cloudflare, so keep redirects relative.
  absolute_redirect off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

  location /_astro/ {
    # File names carry a content hash.
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Live numbers for the cluster section. add_header in a location replaces
  # the server-level ones, so the security headers are repeated here. Both
  # answers are per request and must never be cached, by Cloudflare or anyone.
  # $hostname is the container's hostname, which Kubernetes sets to the pod name.
  location = /live.json {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    return 200 '{"pod":"$hostname","time":$msec}';
  }

  # nginx's own counters for this one pod since it started (plain text).
  location = /live/nginx {
    stub_status;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
